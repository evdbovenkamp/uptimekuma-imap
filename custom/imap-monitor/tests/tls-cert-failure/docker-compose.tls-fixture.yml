# Throwaway TLS endpoint with a self-signed certificate, for exercising the
# "TLS certificate validation failed" path when it cannot be reproduced against a real
# server (see ../functional-test-checklist.md, scenario 5). Run gen-self-signed-cert.sh
# first. Point an IMAP monitor at 127.0.0.1:9933 with imapSecurity=secure; the TLS
# handshake itself fails before anything IMAP-specific is spoken, which is all this
# scenario needs. Tear down with `docker compose -f docker-compose.tls-fixture.yml down`.
services:
  tls-fixture:
    image: alpine:3
    ports:
      - "127.0.0.1:9933:9933"
    volumes:
      - ./fixture.crt:/fixture.crt:ro
      - ./fixture.key:/fixture.key:ro
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
             openssl s_server -quiet -accept 9933 -cert /fixture.crt -key /fixture.key"
